[workspace]
resolver = "3"
members = [
    "crates/cordis-core",
    "crates/cordis-loader",
    "crates/cordis-host",
    "crates/cordis-testkit",
    "crates/cordis-plugin-timer",
    "crates/cordis-plugin-include",
    "crates/cordis-plugin-logger-console",
]
default-members = ["crates/cordis-core"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bayunai/cordis-rs"
homepage = "https://github.com/bayunai/cordis-rs"
documentation = "https://github.com/bayunai/cordis-rs/tree/main/docs"
readme = "README.md"

[workspace.dependencies]
async-trait = "0.1"
axum = "0.8"
cordis-core = { path = "crates/cordis-core" }
cordis-host = { path = "crates/cordis-host" }
cordis-loader = { path = "crates/cordis-loader" }
cordis-plugin-timer = { path = "crates/cordis-plugin-timer" }
cordis-plugin-include = { path = "crates/cordis-plugin-include" }
cordis-plugin-logger-console = { path = "crates/cordis-plugin-logger-console" }
cordis-testkit = { path = "crates/cordis-testkit" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
toml = { version = "0.8", features = ["parse"] }
tokio-util = { version = "0.7", features = ["rt"] }
