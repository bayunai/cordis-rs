[workspace]
resolver = "3"
members = ["crates/cordis-core", "crates/cordis-testkit"]
default-members = ["crates/cordis-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
async-trait = "0.1"
axum = "0.8"
cordis-core = { path = "crates/cordis-core" }
cordis-testkit = { path = "crates/cordis-testkit" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
